k8s-ingress:
  ingress:
    enabled: true
    className: 'nginx'
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/rewrite-target: /$1
    hosts:
      - host: k8s-examples.local
        paths:
          - path: /command/?(.*)
            pathType: ImplementationSpecific
            serviceName: '{{ .Release.Name }}-command'
            servicePort: 3001

          - path: /query/?(.*)
            pathType: ImplementationSpecific
            serviceName: '{{ .Release.Name }}-query'
            servicePort: 3002
