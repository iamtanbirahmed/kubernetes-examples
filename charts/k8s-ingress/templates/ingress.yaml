{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "k8s-ingress.fullname" . }}
  labels:
    {{- include "k8s-ingress.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{- if contains "actions" $key }}
    {{ $key }}: |-
{{ tpl $value $ | indent 6 }}
    {{- else }}
    {{ $key }} : {{ tpl $value $ }}
    {{- end }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}

  {{- if .Values.ingress.defaultBackend }}
  defaultBackend:
    service:
      name: {{ .Values.ingress.defaultBackend.serviceName }}
      port:
        name: use-annotation
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - {{ if .host }}host: {{ .host | quote }} {{ end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}            
            pathType: {{ .pathType | default "ImplementationSpecific" }}            
            backend:
              service:
                name: {{ tpl .serviceName $ }}
                port:
                {{- if eq ( toString .servicePort ) "use-annotation" }}
                  name: use-annotation
                {{- else }} 
                  number: {{ .servicePort }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
