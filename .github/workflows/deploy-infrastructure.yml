name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - demo
          - prod

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      ENV: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Run tests
        run: |
          npx nx run aws:synth --configuration=${{ inputs.environment }}

      - name: Deploy
        run: |
          npx nx run aws:deploy --configuration=${{ inputs.environment }}
